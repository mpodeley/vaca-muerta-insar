# MintPy SBAS — Bajo del Choique INT80 (2020-2026, burst multilook 20x4 ~80 m, track 18 ASC)
# rectángulo 3x2: bursts 018_038428/038429/038430 × IW2/IW3 (el bloque cae fuera de t18_f1050)
mintpy.load.processor        = hyp3
mintpy.load.unwFile          = ../products_int80/*/*_unw_phase.tif
mintpy.load.corFile          = ../products_int80/*/*_corr.tif
mintpy.load.connCompFile     = ../products_int80/*/*_conncomp.tif
mintpy.load.demFile          = ../products_int80/*/*_dem.tif
mintpy.load.incAngleFile     = ../products_int80/*/*_lv_theta.tif
mintpy.load.azAngleFile      = ../products_int80/*/*_lv_phi.tif

# bloque BCLI + margen ~4 km
mintpy.subset.lalo           = -37.84:-37.42,-69.51:-69.05

# 1ª pasada auto; después fijar píxel estable (tempCoh>0.9, fuera del bowl) y re-correr
mintpy.reference.lalo        = auto
mintpy.networkInversion.weightFunc = var
# corrección troposférica ERA5 (reusa GRIB ya bajados por t18_f1050 → mismas pasadas)
mintpy.troposphericDelay.method = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir = /var/home/matias/Projects/subsidencia-vaca-muerta/t18_f1050
mintpy.deramp                = linear
mintpy.topographicResidual   = yes
mintpy.save.hdfEos5          = no
