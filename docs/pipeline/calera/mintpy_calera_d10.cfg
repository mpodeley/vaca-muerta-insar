# MintPy SBAS — La Calera D10 (track 10 DESC, S1C 2025-08 → , burst multilook 10x2 ~40 m)
# bursts 010_020639..020642_IW2 — para descomposición vertical/E-O contra calera-int40 (ASC)
mintpy.load.processor        = hyp3
mintpy.load.unwFile          = ../products_intd10/*/*_unw_phase.tif
mintpy.load.corFile          = ../products_intd10/*/*_corr.tif
mintpy.load.connCompFile     = ../products_intd10/*/*_conncomp.tif
mintpy.load.demFile          = ../products_intd10/*/*_dem.tif
mintpy.load.incAngleFile     = ../products_intd10/*/*_lv_theta.tif
mintpy.load.azAngleFile      = ../products_intd10/*/*_lv_phi.tif

# mismo subset que el stack ascendente (bloque LCA + margen)
mintpy.subset.lalo           = -38.47:-38.16,-69.16:-68.89

# misma referencia FIJA que calera-int40 (imprescindible para descomponer)
mintpy.reference.lalo        = -38.41858,-68.96678
mintpy.networkInversion.weightFunc = var
# ERA5 propio: la pasada DESC es a otra hora que la ASC → los GRIB de t18 no sirven
mintpy.troposphericDelay.method = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir = ./ERA5
mintpy.deramp                = linear
mintpy.topographicResidual   = yes
mintpy.save.hdfEos5          = no
