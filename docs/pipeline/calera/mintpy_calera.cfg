# MintPy SBAS — La Calera INT40 (2020-2026, burst multilook 10x2 ~40 m, track 18 ASC)
# bursts 018_038423/038424/038425_IW2 — análisis de discontinuidades (fallas/flexuras)
mintpy.load.processor        = hyp3
mintpy.load.unwFile          = ../products_int40/*/*_unw_phase.tif
mintpy.load.corFile          = ../products_int40/*/*_corr.tif
mintpy.load.connCompFile     = ../products_int40/*/*_conncomp.tif
mintpy.load.demFile          = ../products_int40/*/*_dem.tif
mintpy.load.incAngleFile     = ../products_int40/*/*_lv_theta.tif
mintpy.load.azAngleFile      = ../products_int40/*/*_lv_phi.tif

# bloque LCA + margen ~4 km (el pico de subsidencia toca el borde oeste del bloque)
mintpy.subset.lalo           = -38.47:-38.16,-69.16:-68.89

# píxel estable elegido contra el 80 m scene-wide: v80 = -0.72 mm/año, tempCoh 0.97,
# a >2 km de pozos (la 1ª pasada auto cayó en zona subsidente: offset +3.3 vs 80 m)
mintpy.reference.lalo        = -38.41858,-68.96678
mintpy.networkInversion.weightFunc = var
# corrección troposférica ERA5 (reusa GRIB ya bajados por t18_f1050 → mismas pasadas)
mintpy.troposphericDelay.method = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir = /var/home/matias/Projects/subsidencia-vaca-muerta/t18_f1050
mintpy.deramp                = linear
mintpy.topographicResidual   = yes
mintpy.save.hdfEos5          = no
